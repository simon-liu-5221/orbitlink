[project]
name = "orbitlink-backend"
version = "0.1.0"
description = "OrbitLink backend — YouTube comment network analysis API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "rq>=2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "import-linter>=2.1",
    "fakeredis>=2.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*" = ["N999"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.analysis.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests that require a database or redis (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*", "alembic/*"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "analysis layer is pure (no db / api / io imports)"
type = "forbidden"
source_modules = ["app.analysis"]
forbidden_modules = [
    "app.api",
    "app.db",
    "app.jobs",
    "app.services",
    "app.ingest",
    "app.core.config",
    "sqlalchemy",
    "fastapi",
    "httpx",
    "redis",
    "alembic",
]
