[project]
name = "orbitlink-backend"
version = "0.1.0"
description = "OrbitLink backend — YouTube comment network analysis API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "rq>=2.0",
    "httpx>=0.28",
    # analysis layer (M1)
    "networkx>=3.4",
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

# The real sentiment/toxicity models (ADR-0004) need `transformers` + `torch`.
# Not declared here — their lock/CUDA footprint is large and they are only
# evaluated for real in M8. Enable with `use_real_sentiment_model=true` after
# `uv pip install transformers torch` (decision B1).

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "fakeredis>=2.26",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The repo lives in a OneDrive folder; hardlinking from uv's local cache into a
# cloud-synced tree fails (os error 396). Copy instead.
link-mode = "copy"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# Docstrings/comments legitimately use math notation (γ) and proper punctuation
# (en dash in "Erdős–Rényi"); the ambiguous-unicode rules are noise here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"app/db/migrations/versions/*" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "app.analysis.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: tests that require a database or redis (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "app/db/migrations/*",
    "alembic/*",
    # real NLP model wrapper — needs the optional 'sentiment' extra, evaluated in M8
    "app/services/sentiment_transformers.py",
]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "analysis layer is pure (no db / api / io imports)"
type = "forbidden"
source_modules = ["app.analysis"]
forbidden_modules = [
    "app.api",
    "app.db",
    "app.jobs",
    "app.services",
    "app.ingest",
    "app.core.config",
    "sqlalchemy",
    "fastapi",
    "httpx",
    "redis",
    "alembic",
]
