# Local development stack. From an empty machine:
#   1. cp .env.example .env
#   2. docker compose up --build
#   3. open http://localhost:5173   (API docs: http://localhost:8000/docs)
#
# Matches roadmap M0: api + worker + postgres + redis (frontend added here for
# a one-command local run — in production it is a separate Render static site).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orbitlink
      POSTGRES_PASSWORD: orbitlink
      POSTGRES_DB: orbitlink
    ports:
      # Host port 15432: avoids a locally-installed PostgreSQL, and sits below
      # 49152 so Windows' dynamic-port reservations can never squat on it.
      # Inside the compose network the port is still 5432 (host "postgres").
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbitlink"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      # Host port 16379, same reasoning as PostgreSQL above.
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outbound email locally. Inbox at http://localhost:8025.
  # Only used when EMAIL_BACKEND=smtp — the default "log" backend needs nothing
  # running at all (decision A1).
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web inbox

  api:
    build: ./backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+psycopg://orbitlink:orbitlink@postgres:5432/orbitlink
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:5173"]'
      FRONTEND_BASE_URL: http://localhost:5173
      EMAIL_BACKEND: smtp
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-change-me}
      PSEUDONYM_KEY: ${PSEUDONYM_KEY:-dev-only-insecure-change-me}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - ./backend:/app
      - /app/.venv          # keep the image's Linux venv, not the host's
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  worker:
    build: ./backend
    restart: unless-stopped
    command: python -m app.jobs.worker
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://orbitlink:orbitlink@postgres:5432/orbitlink
      REDIS_URL: redis://redis:6379/0
      PSEUDONYM_KEY: ${PSEUDONYM_KEY:-dev-only-insecure-change-me}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - ./backend:/app
      - /app/.venv          # keep the image's Linux venv, not the host's
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: ""
      DEV_API_PROXY_TARGET: "http://api:8000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
