# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Provisions the M0 stack:
#   - orbitlink-api : FastAPI (Docker), free web service
#   - orbitlink-web : the Vite build, free static site
#
# Postgres is external (Neon) and Redis is external (Upstash); their URLs are
# set as dashboard secrets (envVars with `sync: false`). The RQ worker is not
# deployed yet — it arrives in M2 (see the commented block below).

services:
  - type: web
    name: orbitlink-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RQ_QUEUE_NAME
        value: orbitlink
      - key: JWT_SECRET
        generateValue: true
      - key: PSEUDONYM_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false          # Neon: postgresql+psycopg://USER:PWD@HOST/DB?sslmode=require
      - key: REDIS_URL
        sync: false          # Upstash: rediss://default:PWD@HOST:PORT
      - key: CORS_ORIGINS
        sync: false          # ["https://orbitlink-web.onrender.com"]
      - key: YOUTUBE_API_KEY
        sync: false          # blank until M2
      # --- M3 auth ---
      - key: FRONTEND_BASE_URL
        value: https://orbitlink-web.onrender.com   # where verification links point
      - key: EMAIL_BACKEND
        value: log           # M3 ships the log backend; swap to smtp with a provider
      - key: COOKIE_SECURE
        value: "true"        # the refresh cookie is HTTPS-only in production
      - key: COOKIE_SAMESITE
        value: lax           # safe because /api is same-origin — see the rewrite below

  - type: web
    name: orbitlink-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: ""            # same-origin: the /api rewrite below reaches the API
    routes:
      # Decision B1: the browser only ever talks to orbitlink-web, so the refresh
      # cookie is first-party (SameSite=Lax, no CORS credentials dance). Must come
      # before the SPA fallback or /api/* would render index.html.
      - type: rewrite
        source: /api/*
        destination: https://orbitlink-api-nooj.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

